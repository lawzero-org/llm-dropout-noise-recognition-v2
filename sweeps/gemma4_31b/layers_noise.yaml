# Layer ablation: one third of the 60 layers perturbed; strengths = the 11 bins of Table 1.
project: llm-dropout-noise
program: spe-localize
method: grid
name: gemma4_31b-layers-noise
metric: {name: accuracy_primary, goal: maximize}
parameters:
  model: {value: gemma4_31b}
  experiment.stage: {value: layers}
  experiment.num_samples: {value: 1000}
  hydra_overrides:
    values: [perturbation.first_layer=0 perturbation.last_layer=19, perturbation.first_layer=20 perturbation.last_layer=39, perturbation.first_layer=40 perturbation.last_layer=59]
  experiment.sentences_file: {value: data/sentences/15tok.txt}
  perturbation.target_perturbation: {value: NOISE}
  perturbation.noise_std:
    values: [0.006, 0.0068, 0.0076, 0.0084, 0.0092, 0.01, 0.0108, 0.0116, 0.0124, 0.0132, 0.014]
