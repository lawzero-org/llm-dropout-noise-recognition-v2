# Function-agent sweep: all dims in `parameters`; run with spe-sweep --experiment localization.
project: llm-dropout-noise
program: spe-localize
method: grid
name: gemma4_31b-loc-noise-fine
metric:
  name: accuracy_primary
  goal: maximize
parameters:
  model:
    value: gemma4_31b
  experiment.stage:
    value: fine
  experiment.num_samples:
    value: 1000
  experiment.sentences_file:
    value: data/sentences/15tok.txt
  perturbation.target_perturbation:
    value: NOISE
  perturbation.noise_std:
    values: [0.001, 0.002, 0.003, 0.004, 0.005, 0.006, 0.007, 0.008, 0.009, 0.011, 0.012, 0.013, 0.014, 0.015, 0.016, 0.017, 0.018, 0.019]
