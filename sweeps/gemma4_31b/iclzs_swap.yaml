# Few-shot classification (paper Sec. 6), prompt icl/main_zs (the zero-shot prompt plus teaching pairs): swapped-label arm: teaching pairs carry the wrong label, k in {1,3,5,7,9}.
# 11 x 11 (p, sigma) grid = the zero-shot strengths, prompts/turns=icl/main_zs, system prompt empty.
# 605 runs. Agent: scripts/sweep_agents.sh with EXPERIMENT=icl,CONFIG_NAME=icl.
project: llm-dropout-noise
program: spe-icl
method: grid
name: gemma4_31b-iclzs-swap
metric:
  name: accuracy_primary
  goal: maximize
parameters:
  model:
    value: gemma4_31b
  experiment.stage:
    value: coarse
  experiment.num_samples:
    value: 1000
  experiment.sentences_file:
    value: data/sentences/15tok.txt
  prompts/turns:
    value: icl/main_zs
  prompts/system:
    value: empty
  prompts.turns.same_sentence:
    value: false
  prompts.turns.same_pair_sentence:
    value: true
  prompts.turns.swap_labels:
    value: true
  aliases:
    value: none
  prompts.turns.num_pairs:
    values:
    - 1
    - 3
    - 5
    - 7
    - 9
  perturbation.dropout_rate:
    values:
    - 0.14
    - 0.194
    - 0.248
    - 0.302
    - 0.356
    - 0.41
    - 0.464
    - 0.518
    - 0.572
    - 0.626
    - 0.68
  perturbation.noise_std:
    values:
    - 0.006
    - 0.0068
    - 0.0076
    - 0.0084
    - 0.0092
    - 0.01
    - 0.0108
    - 0.0116
    - 0.0124
    - 0.0132
    - 0.014
