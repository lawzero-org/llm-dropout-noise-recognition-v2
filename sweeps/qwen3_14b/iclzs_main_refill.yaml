# Refill of the grid points of iclzs_main 0cy5kxyr that have no run with accuracy_primary;
# one hydra_overrides string per missing point, same resolved config -> same hashed seed.
project: llm-dropout-noise
program: spe-icl
method: grid
name: qwen3_14b-iclzs-main-refill
metric:
  name: accuracy_primary
  goal: maximize
parameters:
  model:
    value: qwen3_14b
  experiment.stage:
    value: coarse
  experiment.num_samples:
    value: 1000
  experiment.sentences_file:
    value: data/sentences/15tok.txt
  prompts/turns:
    value: icl/main_zs
  prompts/system:
    value: empty
  prompts.turns.same_sentence:
    value: false
  prompts.turns.same_pair_sentence:
    value: true
  prompts.turns.swap_labels:
    value: false
  aliases:
    value: none
  hydra_overrides:
    values:
    - prompts.turns.num_pairs=3 perturbation.dropout_rate=0.352 perturbation.noise_std=0.075
