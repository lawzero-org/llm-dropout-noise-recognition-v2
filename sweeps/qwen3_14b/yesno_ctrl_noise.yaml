# Function-agent sweep: run with spe-sweep --config-name classification --experiment multiclass.
# Yes/no controls of the yes/no detection sweep qwen3_14b/yesno_noise.yaml (same model, perturbation and strengths): a neutral
# prompt (read a sentence, answer a question) whose question has the answer NO (perturbed_ctrl_no), YES
# (perturbed_ctrl_yes) or no answer (perturbed_ctrl_none, e.g. a coin flip). accuracy_primary is P(model answers YES).
project: llm-dropout-noise
program: spe-classify
method: grid
name: qwen3_14b-yesno-ctrl-noise
metric:
  name: accuracy_primary
  goal: maximize
parameters:
  model:
    value: qwen3_14b
  experiment.stage:
    value: yesno_ctrl
  experiment.num_samples:
    value: 1000
  experiment.sentences_file:
    value: data/sentences/15tok.txt
  prompts/turns:
    values: [classification/perturbed_ctrl_no, classification/perturbed_ctrl_yes, classification/perturbed_ctrl_none]
  perturbation.active_perturbations:
    value: "[NOISE]"
  perturbation.dropout_rate:
    value: 0
  aliases:
    value: noise_yes
  perturbation.noise_std:
    values: [0, 0.05, 0.055, 0.06, 0.065, 0.07, 0.075, 0.08, 0.085, 0.09, 0.095, 0.1]
