# OLMo training-stages figure: localization (Sec. 4 design) for the SFT stage model over the 11 bins of the
# OLMo range (p 0.26..0.66 / sigma 0.02..0.08, constrained metric), same grid as zs_*.yaml. 11 runs.
project: llm-dropout-noise
program: spe-localize
method: grid
name: olmo-stage-sft-loc-dropout
metric:
  name: accuracy_constrained_primary
  goal: maximize
parameters:
  model:
    value: olmo3_32b_instruct_sft
  experiment.stage:
    value: coarse
  experiment.num_samples:
    value: 1000
  experiment.sentences_file:
    value: data/sentences/15tok.txt
  perturbation.target_perturbation:
    value: DROPOUT
  perturbation.dropout_rate:
    values:
    - 0.26
    - 0.3
    - 0.34
    - 0.38
    - 0.42
    - 0.46
    - 0.5
    - 0.54
    - 0.58
    - 0.62
    - 0.66
