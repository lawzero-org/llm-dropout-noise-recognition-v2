# Function-agent sweep: run with spe-sweep --config-name classification --experiment multiclass.
# OLMo SFT stage, yes/no detection at the 11 strengths of its OWN range (0.02, 0.07) (bounds.py on the
# stage's localization sweeps), instead of the RLVR range of yesno_stage_sft_noise.yaml; the unperturbed run is in that sweep.
project: llm-dropout-noise
program: spe-classify
method: grid
name: olmo-stage-sft-yesno-noise-own-range
metric:
  name: accuracy_primary
  goal: maximize
parameters:
  model:
    value: olmo3_32b_instruct_sft
  experiment.stage:
    value: yesno
  experiment.num_samples:
    value: 1000
  experiment.sentences_file:
    value: data/sentences/15tok.txt
  prompts/turns:
    value: classification/perturbed
  perturbation.active_perturbations:
    value: "[NOISE]"
  perturbation.dropout_rate:
    value: 0
  aliases:
    value: noise_yes
  perturbation.noise_std:
    values: [0.02, 0.025, 0.03, 0.035, 0.04, 0.045, 0.05, 0.055, 0.06, 0.065, 0.07]
