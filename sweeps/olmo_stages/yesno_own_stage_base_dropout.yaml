# Function-agent sweep: run with spe-sweep --config-name classification --experiment multiclass.
# OLMo BASE stage, yes/no detection at the 11 strengths of its OWN range (0.06, 0.72) (bounds.py on the
# stage's localization sweeps), instead of the RLVR range of yesno_stage_base_dropout.yaml; the unperturbed run is in that sweep.
project: llm-dropout-noise
program: spe-classify
method: grid
name: olmo-stage-base-yesno-dropout-own-range
metric:
  name: accuracy_primary
  goal: maximize
parameters:
  model:
    value: olmo3_32b_instruct_base
  experiment.stage:
    value: yesno
  experiment.num_samples:
    value: 1000
  experiment.sentences_file:
    value: data/sentences/15tok.txt
  prompts/turns:
    value: classification/perturbed
  perturbation.active_perturbations:
    value: "[DROPOUT]"
  perturbation.noise_std:
    value: 0
  aliases:
    value: dropout_yes
  perturbation.dropout_rate:
    values: [0.06, 0.126, 0.192, 0.258, 0.324, 0.39, 0.456, 0.522, 0.588, 0.654, 0.72]
