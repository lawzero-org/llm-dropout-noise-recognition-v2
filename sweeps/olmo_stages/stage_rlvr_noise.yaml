# OLMo training-stages figure: localization (Sec. 4 design) for the RLVR stage model over the 11 bins of the
# OLMo range (p 0.26..0.66 / sigma 0.02..0.08, constrained metric), same grid as zs_*.yaml. 11 runs.
project: llm-dropout-noise
program: spe-localize
method: grid
name: olmo-stage-rlvr-loc-noise
metric:
  name: accuracy_constrained_primary
  goal: maximize
parameters:
  model:
    value: olmo3_32b
  experiment.stage:
    value: coarse
  experiment.num_samples:
    value: 1000
  experiment.sentences_file:
    value: data/sentences/15tok.txt
  perturbation.target_perturbation:
    value: NOISE
  perturbation.noise_std:
    values:
    - 0.02
    - 0.026
    - 0.032
    - 0.038
    - 0.044
    - 0.05
    - 0.056
    - 0.062
    - 0.068
    - 0.074
    - 0.08
