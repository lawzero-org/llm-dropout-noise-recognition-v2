# Function-agent sweep: all dims in `parameters`; run with spe-sweep --experiment localization.
project: llm-dropout-noise
program: spe-localize
method: grid
name: llama3_8b-ctrl-noise-fine
metric:
  name: accuracy_primary
  goal: maximize
parameters:
  model:
    value: llama3_8b
  experiment.stage:
    value: fine
  experiment.num_samples:
    value: 1000
  perturbation.target_perturbation:
    value: NOISE
  perturbation.same_sentence:
    value: false
  prompts/turns:
    values: ['localization/control_topic_animals_cities', 'localization/control_topic_ocean_mountain', 'localization/control_topic_sports_music', 'localization/control_topic_weather_technology', 'localization/control_topic_gardening_vehicles']
  perturbation.noise_std:
    values: [0, 0.005, 0.01, 0.015, 0.02, 0.025, 0.03, 0.035, 0.04, 0.045, 0.05]
