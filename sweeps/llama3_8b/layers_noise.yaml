# Layer ablation: one third of the 32 layers perturbed; strengths = the 11 bins of Table 1.
project: llm-dropout-noise
program: spe-localize
method: grid
name: llama3_8b-layers-noise
metric: {name: accuracy_primary, goal: maximize}
parameters:
  model: {value: llama3_8b}
  experiment.stage: {value: layers}
  experiment.num_samples: {value: 1000}
  hydra_overrides:
    values: [perturbation.first_layer=0 perturbation.last_layer=10, perturbation.first_layer=11 perturbation.last_layer=20, perturbation.first_layer=21 perturbation.last_layer=31]
  experiment.sentences_file: {value: data/sentences/15tok.txt}
  perturbation.target_perturbation: {value: NOISE}
  perturbation.noise_std:
    values: [0.003, 0.0037, 0.0044, 0.0051, 0.0058, 0.0065, 0.0072, 0.0079, 0.0086, 0.0093, 0.01]
