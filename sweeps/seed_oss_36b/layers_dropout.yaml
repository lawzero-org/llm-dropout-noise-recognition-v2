# Layer ablation: one third of the 64 layers perturbed; strengths = the 11 bins of Table 1.
project: llm-dropout-noise
program: spe-localize
method: grid
name: seed_oss_36b-layers-dropout
metric: {name: accuracy_primary, goal: maximize}
parameters:
  model: {value: seed_oss_36b}
  experiment.stage: {value: layers}
  experiment.num_samples: {value: 1000}
  hydra_overrides:
    values: [perturbation.first_layer=0 perturbation.last_layer=20, perturbation.first_layer=21 perturbation.last_layer=42, perturbation.first_layer=43 perturbation.last_layer=63]
  experiment.sentences_file: {value: data/sentences/15tok.txt}
  perturbation.target_perturbation: {value: DROPOUT}
  perturbation.dropout_rate:
    values: [0.36, 0.41, 0.46, 0.51, 0.56, 0.61, 0.66, 0.71, 0.76, 0.81, 0.86]
