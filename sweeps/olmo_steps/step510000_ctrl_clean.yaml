# OLMo pretraining-steps content baseline WITHOUT perturbation at checkpoint stage1-step510000: 5 topic-pair comprehension
# controls at dropout_rate 0. 5 runs.
project: llm-dropout-noise
program: spe-localize
method: grid
name: olmo-step510000-ctrl-clean
metric:
  name: accuracy_constrained_primary
  goal: maximize
parameters:
  model:
    value: olmo3_32b_instruct_base
  model.revision:
    value: stage1-step510000
  experiment.stage:
    value: coarse
  experiment.num_samples:
    value: 1000
  perturbation.target_perturbation:
    value: DROPOUT
  perturbation.dropout_rate:
    value: 0
  perturbation.noise_std:
    value: 0
  perturbation.same_sentence:
    value: false
  prompts/turns:
    values:
    - localization/control_topic_animals_cities
    - localization/control_topic_ocean_mountain
    - localization/control_topic_sports_music
    - localization/control_topic_weather_technology
    - localization/control_topic_gardening_vehicles
