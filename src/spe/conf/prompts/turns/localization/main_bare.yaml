- localization/main_bare_variants/v05
- localization/main_bare_variants/v06
- localization/main_bare_variants/v07
- localization/main_bare_variants/v08
- localization/main_bare_variants/v09
- localization/main_bare_variants/v10
- localization/main_bare_variants/v11
- localization/main_bare_variants/v12
- localization/main_bare_variants/v13
- localization/main_bare_variants/v14
- localization/main_bare_variants/v15
- localization/main_bare_variants/v16
- localization/main_bare_variants/v17
- localization/main_bare_variants/v18
- localization/main_bare_variants/v19
