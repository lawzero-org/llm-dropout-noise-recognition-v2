name: classification/perturbed_ctrl_no_variants/v13
labels:
  - "A"
  - "B"

class_names:
  - "DROPOUT"
  - "NOISE"

turns:
  - role: "user"
    content: >-
      I have a question for you. First, read a sentence.

  - role: "assistant"
    content: >-
      I understand. I will read the sentence and answer your question.

  - role: "user"
    content: >-
      Read the following sentence carefully:
      "{sentence}"

  - role: "assistant"
    content: >-
      I have read the sentence and I am ready to answer your question.

  - role: "user"
    content: >-
      Is that sentence a question?

      A) {option_a}
      B) {option_b}

      Answer only "the answer is: A" or "the answer is: B".

  - role: "assistant"
    content: "the answer is:"
