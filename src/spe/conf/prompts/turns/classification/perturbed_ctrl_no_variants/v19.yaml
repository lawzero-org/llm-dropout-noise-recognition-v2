name: classification/perturbed_ctrl_no_variants/v19
labels:
  - "A"
  - "B"

class_names:
  - "DROPOUT"
  - "NOISE"

turns:
  - role: "user"
    content: >-
      I will give you a sentence, followed by a question.

  - role: "assistant"
    content: >-
      I understand. I will examine the sentence carefully.

  - role: "user"
    content: >-
      Look at the following sentence:
      "{sentence}"

  - role: "assistant"
    content: >-
      I have examined the sentence and I am ready to answer your question.

  - role: "user"
    content: >-
      Is that sentence written entirely in capital letters?

      A) {option_a}
      B) {option_b}

      Answer only "the answer is: A" or "the answer is: B".

  - role: "assistant"
    content: "the answer is:"
