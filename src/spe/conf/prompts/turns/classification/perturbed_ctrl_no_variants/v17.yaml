name: classification/perturbed_ctrl_no_variants/v17
labels:
  - "A"
  - "B"

class_names:
  - "DROPOUT"
  - "NOISE"

turns:
  - role: "user"
    content: >-
      Read the sentence I give you, then answer my question.

  - role: "assistant"
    content: >-
      I understand. I will examine the sentence carefully.

  - role: "user"
    content: >-
      Read the following sentence carefully:
      "{sentence}"

  - role: "assistant"
    content: >-
      I have read the sentence. I am ready to answer your question.

  - role: "user"
    content: >-
      Is that sentence a question?

      A) {option_a}
      B) {option_b}

      Answer only "the answer is: A" or "the answer is: B".

  - role: "assistant"
    content: "the answer is:"
