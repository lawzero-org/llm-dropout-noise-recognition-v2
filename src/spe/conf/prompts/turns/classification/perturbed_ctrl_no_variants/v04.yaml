name: classification/perturbed_ctrl_no_variants/v04
labels:
  - "A"
  - "B"

class_names:
  - "DROPOUT"
  - "NOISE"

turns:
  - role: "user"
    content: >-
      I will give you a sentence, followed by a question.

  - role: "assistant"
    content: >-
      I understand. I will read the sentence carefully.

  - role: "user"
    content: >-
      Consider the following sentence carefully:
      "{sentence}"

  - role: "assistant"
    content: >-
      I have read the sentence. I am ready to answer your question.

  - role: "user"
    content: >-
      Is that sentence written in French?

      A) {option_a}
      B) {option_b}

      Answer only "the answer is: A" or "the answer is: B".

  - role: "assistant"
    content: "the answer is:"
