name: classification/perturbed_ctrl_none_variants/v06
labels:
  - "A"
  - "B"

class_names:
  - "DROPOUT"
  - "NOISE"

turns:
  - role: "user"
    content: >-
      I would like you to read a sentence and then answer a question.

  - role: "assistant"
    content: >-
      I understand. I will read it carefully.

  - role: "user"
    content: >-
      Look at the following sentence:
      "{sentence}"

  - role: "assistant"
    content: >-
      I have examined the sentence and I am ready to answer your question.

  - role: "user"
    content: >-
      Before showing you that sentence, I rolled a die. Did it land on an even number?

      A) {option_a}
      B) {option_b}

      Answer only "the answer is: A" or "the answer is: B".

  - role: "assistant"
    content: "the answer is:"
