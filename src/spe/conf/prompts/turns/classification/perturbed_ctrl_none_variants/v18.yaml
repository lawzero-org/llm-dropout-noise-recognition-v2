name: classification/perturbed_ctrl_none_variants/v18
labels:
  - "A"
  - "B"

class_names:
  - "DROPOUT"
  - "NOISE"

turns:
  - role: "user"
    content: >-
      I have a question for you. First, read a sentence.

  - role: "assistant"
    content: >-
      I understand. I will examine the sentence carefully.

  - role: "user"
    content: >-
      Consider the following sentence:
      "{sentence}"

  - role: "assistant"
    content: >-
      I have read the sentence and I am ready to answer.

  - role: "user"
    content: >-
      Before showing you that sentence, I rolled a die. Did it land on an even number?

      A) {option_a}
      B) {option_b}

      Answer only "the answer is: A" or "the answer is: B".

  - role: "assistant"
    content: "the answer is:"
