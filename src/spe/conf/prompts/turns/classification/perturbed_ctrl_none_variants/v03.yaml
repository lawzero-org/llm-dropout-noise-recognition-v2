name: classification/perturbed_ctrl_none_variants/v03
labels:
  - "A"
  - "B"

class_names:
  - "DROPOUT"
  - "NOISE"

turns:
  - role: "user"
    content: >-
      I have a question for you. First, read a sentence.

  - role: "assistant"
    content: >-
      I understand. I will read the sentence carefully.

  - role: "user"
    content: >-
      Read the following sentence:
      "{sentence}"

  - role: "assistant"
    content: >-
      I have examined the sentence and I am ready to answer your question.

  - role: "user"
    content: >-
      Before showing you that sentence, I picked a whole number at random. Is it even?

      A) {option_a}
      B) {option_b}

      Answer only "the answer is: A" or "the answer is: B".

  - role: "assistant"
    content: "the answer is:"
