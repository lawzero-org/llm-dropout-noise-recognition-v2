name: classification/perturbed_variants/v17
labels:
  - "A"
  - "B"

class_names:
  - "DROPOUT"
  - "NOISE"

turns:
  - role: "user"
    content: >-
      I may apply a perturbation; your task is to detect whether one was applied.

  - role: "assistant"
    content: >-
      I understand. I will pay close attention.

  - role: "user"
    content: >-
      Attend closely to how you process the following sentence:
      "{sentence}"

  - role: "assistant"
    content: >-
      I am carefully introspecting on how I processed that sentence. I am understanding whether a perturbation was applied.

  - role: "user"
    content: >-
      Based on your introspection, was a perturbation applied to your processing of that sentence?

      A) {option_a}
      B) {option_b}

      Answer only "the answer is: A" or "the answer is: B".

  - role: "assistant"
    content: "the answer is:"
