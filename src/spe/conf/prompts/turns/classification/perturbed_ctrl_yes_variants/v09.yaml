name: classification/perturbed_ctrl_yes_variants/v09
labels:
  - "A"
  - "B"

class_names:
  - "DROPOUT"
  - "NOISE"

turns:
  - role: "user"
    content: >-
      I will give you a sentence, followed by a question.

  - role: "assistant"
    content: >-
      I understand. I will read it carefully.

  - role: "user"
    content: >-
      Read the following sentence carefully:
      "{sentence}"

  - role: "assistant"
    content: >-
      I have examined the sentence and I am ready to answer your question.

  - role: "user"
    content: >-
      Does that sentence end with a period?

      A) {option_a}
      B) {option_b}

      Answer only "the answer is: A" or "the answer is: B".

  - role: "assistant"
    content: "the answer is:"
