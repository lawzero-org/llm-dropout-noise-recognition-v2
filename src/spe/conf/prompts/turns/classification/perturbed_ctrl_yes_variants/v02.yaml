name: classification/perturbed_ctrl_yes_variants/v02
labels:
  - "A"
  - "B"

class_names:
  - "DROPOUT"
  - "NOISE"

turns:
  - role: "user"
    content: >-
      Read the sentence I give you, then answer my question.

  - role: "assistant"
    content: >-
      I understand. I will read the sentence carefully.

  - role: "user"
    content: >-
      Look at the following sentence:
      "{sentence}"

  - role: "assistant"
    content: >-
      I have read the sentence and I am ready to answer.

  - role: "user"
    content: >-
      Does that sentence contain more than three words?

      A) {option_a}
      B) {option_b}

      Answer only "the answer is: A" or "the answer is: B".

  - role: "assistant"
    content: "the answer is:"
