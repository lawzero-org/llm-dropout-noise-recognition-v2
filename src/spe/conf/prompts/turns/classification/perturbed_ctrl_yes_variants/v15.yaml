name: classification/perturbed_ctrl_yes_variants/v15
labels:
  - "A"
  - "B"

class_names:
  - "DROPOUT"
  - "NOISE"

turns:
  - role: "user"
    content: >-
      I will show you a sentence and then ask you a question.

  - role: "assistant"
    content: >-
      I understand. I will examine the sentence carefully.

  - role: "user"
    content: >-
      Read the following sentence:
      "{sentence}"

  - role: "assistant"
    content: >-
      I have read the sentence and I am ready to answer.

  - role: "user"
    content: >-
      Does that sentence contain lowercase letters?

      A) {option_a}
      B) {option_b}

      Answer only "the answer is: A" or "the answer is: B".

  - role: "assistant"
    content: "the answer is:"
