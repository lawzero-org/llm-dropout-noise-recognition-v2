name: classification/perturbed_ctrl_yes_variants/v07
labels:
  - "A"
  - "B"

class_names:
  - "DROPOUT"
  - "NOISE"

turns:
  - role: "user"
    content: >-
      Read the sentence I give you, then answer my question.

  - role: "assistant"
    content: >-
      I understand. I will read it carefully.

  - role: "user"
    content: >-
      Read the following sentence:
      "{sentence}"

  - role: "assistant"
    content: >-
      I have read the sentence and I am ready to answer your question.

  - role: "user"
    content: >-
      Does that sentence contain lowercase letters?

      A) {option_a}
      B) {option_b}

      Answer only "the answer is: A" or "the answer is: B".

  - role: "assistant"
    content: "the answer is:"
