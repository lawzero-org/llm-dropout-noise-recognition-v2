name: classification/perturbed_ctrl_yes_variants/v18
labels:
  - "A"
  - "B"

class_names:
  - "DROPOUT"
  - "NOISE"

turns:
  - role: "user"
    content: >-
      I have a question for you. First, read a sentence.

  - role: "assistant"
    content: >-
      I understand. I will examine the sentence carefully.

  - role: "user"
    content: >-
      Consider the following sentence:
      "{sentence}"

  - role: "assistant"
    content: >-
      I have read the sentence and I am ready to answer.

  - role: "user"
    content: >-
      Does that sentence contain more than three words?

      A) {option_a}
      B) {option_b}

      Answer only "the answer is: A" or "the answer is: B".

  - role: "assistant"
    content: "the answer is:"
