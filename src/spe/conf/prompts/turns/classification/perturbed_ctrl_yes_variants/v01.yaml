name: classification/perturbed_ctrl_yes_variants/v01
labels:
  - "A"
  - "B"

class_names:
  - "DROPOUT"
  - "NOISE"

turns:
  - role: "user"
    content: >-
      I would like you to read a sentence and then answer a question.

  - role: "assistant"
    content: >-
      I understand. I will read the sentence carefully.

  - role: "user"
    content: >-
      Consider the following sentence:
      "{sentence}"

  - role: "assistant"
    content: >-
      I have read the sentence. I am ready to answer your question.

  - role: "user"
    content: >-
      Does that sentence end with a period?

      A) {option_a}
      B) {option_b}

      Answer only "the answer is: A" or "the answer is: B".

  - role: "assistant"
    content: "the answer is:"
